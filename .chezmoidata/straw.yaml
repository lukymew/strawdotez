# Módulos e perfis do comando `straw menu`.
# Cada módulo tem uma lista de pacotes por ambiente: termux, apt (Debian, Ubuntu, Kali) e apk (Alpine).
# Módulo sem lista para o ambiente atual não aparece nele.
# Perfil com `only` aparece só nos ambientes listados (termux, apt, apk).
straw:
  modules:
    utils:
      icon: "🧰"
      group: cli
      pt: "Utilitários do dia a dia (jq, tree, htop, rsync)"
      en: "Everyday utilities (jq, tree, htop, rsync)"
      termux: [jq, tree, htop, rsync, termux-api]
      apt: [jq, tree, htop, rsync]
      apk: [jq, tree, htop, rsync]
    dev:
      icon: "🛠️"
      group: dev
      pt: "Dev: C e C++ (compilador, make, cmake, gdb)"
      en: "Dev: C and C++ (compiler, make, cmake, gdb)"
      termux: [clang, make, cmake, gdb]
      apt: [build-essential, cmake, gdb]
      apk: [build-base, cmake, gdb]
    golang:
      icon: "🐹"
      group: dev
      pt: "Dev: Go"
      en: "Dev: Go"
      termux: [golang]
      apt: [golang-go]
      apk: [go]
    rust:
      icon: "🦀"
      group: dev
      pt: "Dev: Rust"
      en: "Dev: Rust"
      termux: [rust]
      apt: [rustc, cargo]
      apk: [rust, cargo]
    web:
      icon: "🌐"
      group: dev
      pt: "Dev: web (PHP e SQLite)"
      en: "Dev: web (PHP and SQLite)"
      termux: [php, sqlite]
      apt: [php-cli, sqlite3]
      apk: [php, sqlite]
    network:
      icon: "📡"
      group: net
      pt: "Rede (nmap, traceroute, whois, mtr, iperf3, netcat)"
      en: "Network (nmap, traceroute, whois, mtr, iperf3, netcat)"
      termux: [nmap, traceroute, whois, mtr, iperf3, netcat-openbsd, openssl-tool]
      apt: [nmap, traceroute, whois, mtr-tiny, iperf3, netcat-openbsd]
      apk: [nmap, traceroute, whois, mtr, iperf3, netcat-openbsd]
    pentest:
      icon: "🕵️"
      group: net
      pt: "Pentest (hydra, sqlmap, john): só em sistemas com autorização"
      en: "Pentest (hydra, sqlmap, john): only on systems you are authorized to test"
      termux: [nmap, hydra, sqlmap]
      apt: [nmap, hydra, sqlmap, john, nikto]
      apk: [nmap, hydra]
    privacy:
      icon: "🔐"
      group: cli
      pt: "Criptografia e segredos (gnupg, age, pass)"
      en: "Encryption and secrets (gnupg, age, pass)"
      termux: [gnupg, age, pass]
      apt: [gnupg, age, pass]
      apk: [gnupg, age, pass]
    media:
      icon: "🎬"
      group: cli
      pt: "Mídia (ffmpeg, imagemagick, yt-dlp)"
      en: "Media (ffmpeg, imagemagick, yt-dlp)"
      termux: [ffmpeg, imagemagick, yt-dlp]
      apt: [ffmpeg, imagemagick, yt-dlp]
      apk: [ffmpeg, imagemagick, yt-dlp]
    editors:
      icon: "✏️"
      group: cli
      pt: "Editores extras (vim, helix)"
      en: "Extra editors (vim, helix)"
      termux: [vim, helix]
      apt: [vim]
      apk: [vim, helix]
    ai:
      icon: "🤖"
      group: cli
      pt: "IA local (llama.cpp, experimental)"
      en: "Local AI (llama.cpp, experimental)"
      termux: [llama-cpp]
  profiles:
    minimal:
      pt: "Mínimo: só o essencial, nada a mais"
      en: "Minimal: just the essentials, nothing extra"
      modules: []
    standard:
      pt: "Padrão: essencial mais utilitários"
      en: "Standard: essentials plus utilities"
      modules: [utils]
    developer:
      pt: "Desenvolvedor: utilitários, C/C++, Go, Rust, web e editores"
      en: "Developer: utilities, C/C++, Go, Rust, web and editors"
      modules: [utils, dev, golang, rust, web, editors]
    network:
      pt: "Redes: utilitários e ferramentas de rede"
      en: "Networking: utilities and network tools"
      modules: [utils, network]
    pentest:
      pt: "Pentest: rede, ferramentas de teste e criptografia (uso autorizado)"
      en: "Pentest: network, testing tools and encryption (authorized use only)"
      modules: [utils, network, pentest, privacy]
      only: [termux, apt]
    creator:
      pt: "Criador: utilitários, mídia e editores"
      en: "Creator: utilities, media and editors"
      modules: [utils, media, editors]
      only: [termux, apt, apk]
    full:
      pt: "Completo: tudo, menos pentest e IA"
      en: "Full: everything except pentest and AI"
      modules: [utils, dev, golang, rust, web, network, privacy, media, editors]
