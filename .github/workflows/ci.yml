name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Templates, sintaxe e idiomas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar zsh e chezmoi
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Rodar as checagens
        run: bash scripts/ci-check.sh
      - name: shellcheck nos scripts do repositório
        run: |
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning install.sh scripts/*.sh .githooks/pre-commit

  secrets:
    name: Verificação de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
